name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # This must be lowercase — GHCR requires it
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        run: cd backend && pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.backend.outputs.digest }}
      frontend: ${{ steps.frontend.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/poker-backend:latest
            ${{ env.IMAGE_PREFIX }}/poker-backend:${{ github.sha }}

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/poker-frontend:latest
            ${{ env.IMAGE_PREFIX }}/poker-frontend:${{ github.sha }}

  # Nothing here can reach the server. The home server follows the deploy
  # branch (soljt/edge-proxy, home/app-pull), so this commits the compose file
  # with each image pinned to the digest just built. The branch only moves
  # once both images exist, and every deploy is a commit you can revert.
  publish:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-branch
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Commit pinned images to the deploy branch
        env:
          BACKEND: ${{ env.IMAGE_PREFIX }}/poker-backend@${{ needs.build-and-push.outputs.backend }}
          FRONTEND: ${{ env.IMAGE_PREFIX }}/poker-frontend@${{ needs.build-and-push.outputs.frontend }}
        run: |
          set -eu
          out="$RUNNER_TEMP/docker-compose.yml"
          sed -e "s|image: ghcr.io/soljt/poker-backend:latest|image: $BACKEND|" \
              -e "s|image: ghcr.io/soljt/poker-frontend:latest|image: $FRONTEND|" \
              docker-compose.yml > "$out"
          grep -qF "image: $BACKEND" "$out" && grep -qF "image: $FRONTEND" "$out"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin deploy; then
              git switch -q -c deploy FETCH_HEAD
          else
              git switch -q --orphan deploy
          fi
          cp "$out" docker-compose.yml
          git add docker-compose.yml
          git diff --cached --quiet || git commit -qm "Deploy $GITHUB_SHA"
          git push -q origin deploy
