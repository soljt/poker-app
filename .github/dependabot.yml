version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps the pins current. Each PR
  # bumps the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A compromised release is usually caught and pulled within days, so
    # don't propose anything younger than a week.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Base images in the Dockerfiles, and the db/redis images in the compose
  # file, are pinned by digest; these keep them current.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Postgres major upgrades need a dump and restore.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
