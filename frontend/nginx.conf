# Requests arrive from the home ingress (soljt/edge-proxy, home/), the only
# other container on this network, with the client's address in
# X-Forwarded-For. Take it from there, so the backend's rate limits and
# Turnstile checks see real clients rather than the ingress.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Forwarded-For;

server {
    listen 8080;
    server_name poker.soljt.ch www.poker.soljt.ch;
    root /usr/share/nginx/html;

    location / {
        index index.html;
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /assets/ {
        # Hashed filenames → safe to cache aggressively
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_http_version 1.1;
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_pass http://backend:5000/socket.io;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}